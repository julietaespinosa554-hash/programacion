<body>
    <script>

const palabras = [
"casa",
"sol",
"computadora",
"flor",
"gato"
];

function palabrasPares(vector){

    return vector
    .filter(palabra => palabra.length % 2 == 0)
    .map(palabra => palabra.toUpperCase());

}

console.log(palabrasPares(palabras));

</script>
</body>
