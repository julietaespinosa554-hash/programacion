<h2>Ejercicio 4</h2>

<script>

let palabras = [
    "casa",
    "sol",
    "computadora",
    "flor",
    "gato",
    "javascript",
    "mesa",
    "avion",
    "pan"
];
let resultado = palabras.filter(palabra =>
    palabra.length >= 3 && palabra.length <= 7
);

console.log("Cantidad de palabras entre 3 y 7 letras:", resultado.length);

</script>
